{% extends 'base.html' %}

{% block body %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Portfólio - Edson Santos</title>
  <style >
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #65CEE6;
      color: #333;
    }
    header {
      background: #222;
      color: white;
      padding: 20px;
      text-align: center;
    }
    header h1 {
      margin: 0;
    }
    header p {
      margin: 5px 0 0;
      font-size: 18px;
      color: #bbb;
    }
    section {
      padding: 40px 20px;
      max-width: 1000px;
      margin: auto;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      padding: 20px;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .card h3 {
      margin-top: 0;
    }
    .tags {
      margin: 10px 0;
    }
    .tag {
      display: inline-block;
      background: #007BFF;
      color: white;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 12px;
      margin-right: 5px;
    }
    footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Edson Santos</h1>
    <p>Desenvolvedor Python | Web | Automação</p>
  </header>

  <section>
    <h2>📌 Projetos (13)</h2>
    <div class="projects" id="projects-container"></div>
  </section>

  <footer>
    <p>© 2025 - Edson Santos | <a href="https://github.com/EdsonSantos-lab" style="color:#4DA8FF;">GitHub</a> | <a href="https://www.linkedin.com/in/edson-santos-6a60b3292/" style="color:#4DA8FF;">LinkedIn</a></p>
  </footer>

  <script>
    const projects = [
      {
        title: '<a href="https://github.com/EdsonSantos-lab/sistema_cota-o_tkinter">💠 Sistema de Cotação de Moedas em Python</a>',

        technologies: ["Python 3", "Tkinter", "Requests", "Pandas", "Numpy", "Openpyxl"],
        features: [
          "✔ Consulta da cotação de uma moeda específica em uma data escolhida",
          "✔ Atualização de múltiplas moedas a partir de arquivo Excel",
          "✔ Exportação automática para Excel",
          "✔ Interface gráfica simples e intuitiva"
        ],
        learnings: [
          "Integração do Python com APIs externas",
          "Construção de interfaces gráficas com Tkinter",
          "Manipulação de arquivos Excel",
          "Organização do fluxo entre interface, API e persistência"
        ]
      },
      {
        title: '<a href="https://github.com/EdsonSantos-lab/Replica_-FlappyBird"> 💠 Sistema Flappy Bird em Python</a>',
        description: "Este projeto é uma recriação do clássico jogo Flappy Bird, desenvolvida totalmente em Python utilizando a biblioteca Pygame.",
        technologies: ["Python", "Pygame"],
        features: [
          "✔ Controle do pássaro com a tecla espaço.",
          "✔ Sistema de pontuação em tempo real.",
          "✔ Detecção de colisões precisa usando masks.",
          "✔ Geração aleatória da altura dos obstáculos.",
          "✔ Movimentação contínua do chão e dos canos."
        ],
        learnings: [
          "Controle de eventos e detecção de colisões.",

          "Programação orientada a objetos.",
          "Estruturação de jogos 2D."
        ]
      },
      {

        technologies: ["Python ", "Selenium", "Openpyxl"],
        features: [

      {

        description: "Este projeto automatiza a criação de certificados personalizados para participantes de cursos, lendo informações de uma planilha Excel e gerando arquivos de imagem individuais. Cria certificados de forma rápida e profissional.",
        technologies: ["Python ", "Pillow", "Pandas"],
        features: [
          "✔ Importa a planilha planilha_alunos.xlsx contendo informações dos participantes",
          "✔ Para cada linha da planilha, insere os dados do participante nos locais corretos do certificado.",
          "✔ Utiliza a classe ImageDraw para adicionar textos sobre a imagem. ",
          "✔ Leitura de dados do Excel"
        ],
        learnings: [
          "Importação de dados",
          "Sobrescrever texto em imagens",
          "Manipulação de arquivos Excel"
        ]
      },
      {
        title: '<a href="https://github.com/EdsonSantos-lab/ProjetodeConsultas-site">💠 Automação de Preenchimento de Formulários com Selenium</a>',
        description: "Este projeto demonstra a automação de tarefas repetitivas em navegadores web usando Python e Selenium WebDriver. Ele lê dados de uma planilha Excel e preenche automaticamente formulários em um site local (index.html), simulando interações humanas como cliques, preenchimento de campos e navegação entre abas.",
        technologies: ["Python", "WebDriver", "Excel", "Numpy", "Openpyxl"],
        features: [
          "✔ Consulta da cotação de uma moeda específica em uma data escolhida",
          "✔ Atualização de múltiplas moedas a partir de arquivo Excel",

          "✔ Interface gráfica simples e intuitiva"
        ],
        learnings: [

      },
      {

        features: [

        technologies: ["Python", "Pyautogui"],
        features: [
          "✔ Monitora a cor de um pixel em uma posição fixa da tela",
          "✔ Captura em tempo real a posição e cor do mouse. ",

        ],

          "Automatizar interações com mouse e tela em Python."
        ]
      },
      {
        title: '<a href="https://github.com/EdsonSantos-lab/RelogioDigital">💠 Relógio Digital em Python</a>',

      {

        technologies: ["Python", "Matplolib"],
        features: [
          "✔ Criação de gráfico de dispersão (scatter plot) para representar vendas por mês",

          "✔  Customização com título, legendas e cores para melhor visualização"
        ],
        learnings: [
          "Conceitos de data visualization aplicados em Python",
          "Uso da função annotate() para destacar informações importantes",
          "Como utilizar o Matplotlib para criar gráficos personalizados"
        ]
      },
      {
        title: '<a href="https://github.com/EdsonSantos-lab/GeradorSenhas/tree/main">💠Gerador de Senhas </a>',
        description: "Este projeto é um gerador automático de senhas que cria combinações de caracteres utilizando letras, números e símbolos especiais. O objetivo é facilitar a criação de senhas seguras e únicas, ideais para uso em contas pessoais, sistemas ou aplicações.",
        technologies: ["Python", "Biblioteca random"],
        features: [
          "✔ Senhas de 4 dígitos geradas de forma aleatória e independente",
          "✔ Exibição organizada e destacada no terminal, com cores para melhor visualização ",
          "✔ Uso de letras maiúsculas, minúsculas, dígitos e caracteres especiais ",
          "✔ Geração de múltiplas senhas em uma única execução "
        ],
        learnings: [
          "Estruturação de código com funções reutilizáveis",
          "Formatação colorida no terminal para melhorar a experiência do usuário"
        ]
      },
      {
        title: '<a href="https://github.com/EdsonSantos-lab/app-de-compras">💠Projeto: Lista de Compras</a>',
        description: "Este projeto é um gerenciador de lista de compras feito em Python. Ele permite criar listas, adicionar/remover itens, visualizar o carrinho e salvar os dados em um arquivo .json para carregar depois.",
        technologies: ["Módulo JSON", "Estruturas de dados"],
        features: [
          "✔ Criar uma nova lista de compras ",
          "✔ Adicionar itens com quantidades ",
          "✔ Remover itens",
          "✔ Visualizar lista atual"
        ],
        learnings: [
          "Tratamento de erros (ex.: arquivo inexistente)",
          "Estruturação de menus interativo",
          "Manipulação de arquivos JSON em Python"

      },
      {
        title: '<a href="https://github.com/EdsonSantos-lab/Projeto-de-Cadastro">💠 Automação Completa de Cadastro de Produtos em Web App</a>',
        description: "Este projeto automatiza o cadastro de produtos em um sistema web, lendo informações de uma planilha Excel e preenchendo campos de formulários de maneira precisa e rápida. Ele combina técnicas de automação de navegador com Selenium, automação de interface gráfica com PyAutoGUI e manipulação de arquivos Excel com OpenPyXL.",

        features: [
          "✔ Simular cliques precisos em coordenadas da tela ",
          "✔ Inicializa o navegador Chrome com Selenium WebDriver.",
          "✔ Inicialização e Navegação Automática"
        ],
        learnings: [
          "Integração de tecnologias",
          "Precisão",
          "Redução de tarefas manuais"
        ]
      },
      {
        title: '<a href="https://github.com/EdsonSantos-lab/aplicativo-com-kivy"> 💠 Aplicativo de Vendas</a>',
        description: "Este projeto demonstra a criação de um aplicativo mobile utilizando Kivy, um framework Python multiplataforma capaz de gerar apps para Android, Windows, Linux e mais. O foco deste projeto é ensinar a estrutura, funcionamento e boas práticas para desenvolvimento de aplicativos completos.",
        technologies: ["Python 3", "Firebase", "Kivy", "Buildozer"],
        features: [
          "✔ Sistema de vendas completo",
          "✔ Login e criação de conta utilizando Firebase Authentication (REST API).",

        learnings: [
          "Manipulação de Dados no App",
          "Integração com Firebase",

          "Conexão entre Python ↔ KV"
        ]
      },


    ];

    function renderProjects() {
      const container = document.getElementById("projects-container");
      projects.forEach(p => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <h3>${p.title}</h3>
          <p>${p.description}</p>
          <div class="tags">${p.technologies.map(t => `<span class="tag">${t}</span>`).join("")}</div>
          <h4>Funcionalidades:</h4>
          <ul>${p.features.map(f => `<li>${f}</li>`).join("")}</ul>
          <h4>Aprendizados:</h4>
          <ul>${p.learnings.map(l => `<li>${l}</li>`).join("")}</ul>
        `;
        container.appendChild(card);
      }
      );
    }

    renderProjects();
  </script>
</body>
</html>



{% endblock %}
